<!DOCTYPE html>
<html>
    <head>
        <title>Admin Live Chat</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <script src="https://cdn.tailwindcss.com"></script>
            
            <style>
              body { margin:0; font-family: system-ui; background:#0b1220; color:white; }

              .wrap {
                max-width:720px;
                margin:auto;
                height:100vh;
                display:flex;
                flex-direction:column;
              }

              .header {
                padding:16px;
                font-size:16px;
                font-weight:700;
                color:#10b981;
                background:#0f172a;
                border-bottom:1px solid rgba(255,255,255,0.08);
              }

                .messages {
                  flex:1;
                  overflow-y:auto;
                  padding:16px;
                  display:flex;
                  flex-direction:column;
                  gap:12px;
                }

                .msg {
                  max-width:78%;
                  padding:11px 14px;
                  border-radius:16px;
                  font-size:14px;
                  line-height:1.4;
                }

                /* ADMIN VIEW */
                .user {                    /* User messages → LEFT */
                  align-self: flex-start;
                  background:#1f2937;
                  color:#e5e7eb;
                }

                .admin {                   /* Admin messages → RIGHT */
                  align-self: flex-end;
                  background:#10b981;
                  color:#06281d;
                  font-weight:500;
                }
              .inputBox {
                display:flex;
                gap:8px;
                padding:12px;
                border-top:1px solid rgba(255,255,255,0.08);
                background:#0f172a;
              }

              input {
                flex:1;
                padding:14px;
                border-radius:12px;
                background:#111827;
                color:white;
                border:none;
                outline:none;
              }

              button {
                background:#10b981;
                color:white;
                padding:0 20px;
                border-radius:12px;
                border:none;
                cursor:pointer;
              }
            </style>
    </head>

<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    Admin Live Chat
  </div>

  <!-- MESSAGES -->
  <div id="messages" class="messages"></div>

  <!-- INPUT -->
  <div class="inputBox">
    <input id="input" placeholder="Type message as admin...">
    <button onclick="send()">Send</button>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const messagesDiv = document.getElementById("messages");
  const input = document.getElementById("input");
  const sendBtn = document.querySelector(".inputBox button");

  async function loadChats() {
    try {
      const res = await fetch("/chat/feed");
      const data = await res.json();

      messagesDiv.innerHTML = "";

      (data.chats || []).forEach(c => {
        const div = document.createElement("div");
        div.classList.add("msg");

        const sender = String(c.from || c.sender || "").toLowerCase();

        if (sender === "admin") {
          div.classList.add("admin");     // Right
        } else {
          div.classList.add("user");      // Left
        }

        div.textContent = c.message || c.text || c.reply || "";
        messagesDiv.appendChild(div);
      });

      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    } catch (e) {
      console.error("Load error:", e);
    }
  }

  async function sendMessage() {
    const msg = input.value.trim();
    if (!msg) return;

    // Optimistic UI - show on right
    const temp = document.createElement("div");
    temp.classList.add("msg", "admin");
    temp.textContent = msg;
    messagesDiv.appendChild(temp);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    input.value = "";

    // Send to backend
    await fetch("/chat/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        from: "admin",
        message: msg
      })
    });

    // Small delay then refresh
    setTimeout(loadChats, 600);
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keypress", e => { if(e.key === "Enter") sendMessage(); });

  setInterval(loadChats, 2500);
  loadChats();
});
</script>
</body>
</html>
