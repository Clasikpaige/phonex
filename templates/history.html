<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>History</title>

<style>
body { font-family: Arial; background:#f4f4f4; }
.container { max-width:900px; margin:40px auto; }
.card { background:white; padding:15px; margin-bottom:10px; border-radius:10px; }
.amount { float:right; font-weight:bold; }
.pos { color:green; }
.neg { color:red; }
</style>
</head>

<body>

<div class="container">

<h2>Transaction History</h2>

<a href="{{ url_for('dashboard') }}">Back</a>

{% for tx in account.transactions %}

<div class="card">

    <div>
        <b>{{ tx.category }}</b>

        <span class="amount {% if tx.amount < 0 %}neg{% else %}pos{% endif %}">
            ${{ "{:,.2f}".format(tx.amount) }}
        </span>
    </div>

    <div>{{ tx.description }}</div>
    <small>{{ tx.date }} • {{ tx.note }}</small>

    <br>
    <small>Balance: ${{ "{:,.2f}".format(tx.running_balance) }}</small>

</div>

{% endfor %}

</div>

</body>
</html>
