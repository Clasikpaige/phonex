<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Withdraw | MyBank</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Tailwind (layout helpers only) -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ---------- Base ---------- */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  background: linear-gradient(180deg, #f9fafb 0%, #eef2f7 100%);
  color: #1f2937;
}

/* ---------- Main Panel ---------- */
.bank-shell {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bank-panel {
  width: 100%;
  max-width: 520px;
  background: #ffffff;
  border-radius: 20px;
  padding: 28px 26px;
  box-shadow:
    0 10px 25px rgba(0,0,0,.06),
    0 2px 6px rgba(0,0,0,.04);
  animation: fadeUp .6s ease;
}

/* ---------- Header ---------- */
.bank-title {
  font-size: 1.25rem;
  font-weight: 500;
  letter-spacing: .2px;
  text-align: center;
  margin-bottom: 24px;
}

/* ---------- Field Group ---------- */
.field-group {
  margin-bottom: 18px;
  animation: fadeUp .6s ease;
}

label {
  font-size: .78rem;
  color: #6b7280;
  margin-bottom: 6px;
  display: block;
}

/* ---------- Inputs ---------- */
input, select {
  width: 100%;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px 14px;
  font-size: .95rem;
  background: #f9fafb;
  transition: all .25s ease;
}

input:focus, select:focus {
  outline: none;
  border-color: #6366f1;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(99,102,241,.12);
}

/* ---------- Button ---------- */
.bank-btn {
  margin-top: 8px;
  padding: 14px;
  border-radius: 14px;
  background: linear-gradient(135deg, #4f46e5, #6366f1);
  color: white;
  font-weight: 500;
  border: none;
  transition: transform .15s ease, box-shadow .15s ease;
}

.bank-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 20px rgba(79,70,229,.25);
}

/* ---------- Animations ---------- */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="bank-shell">
  <div class="bank-panel">

    <div class="bank-title">
      Withdrawal — {{ account.name }}
    </div>

    <!-- Amount -->
    <div class="field-group">
      <label>Amount</label>
      <input type="number" placeholder="$0.00" id="amount">
    </div>

    <!-- Method -->
    <div class="field-group">
      <label>Withdrawal Method</label>
      <select id="methodSelect">
        <option value="" disabled selected>Select option</option>
        <option value="cashapp">Cash App</option>
        <option value="revolut">Revolut</option>
      </select>
    </div>

    <!-- Cash App -->
    <div class="field-group d-none" id="cashappRow">
      <label>Cash App Tag</label>
      <input type="text" placeholder="$username">
    </div>

    <!-- Revolut -->
    <div class="field-group d-none" id="revolutRow">
      <label>Account Number</label>
      <input type="text" placeholder="Account number" class="mb-2">
      <input type="text" placeholder="Routing number">
    </div>

    <button class="bank-btn w-100" onclick="submitWithdrawal()">
      Continue
    </button>

  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="restrictionModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 p-3">

      <div class="modal-header border-0">
        <h5 class="modal-title text-danger fw-semibold">
          Transaction Restricted
        </h5>
      </div>

      <div class="modal-body text-sm text-muted">
        Secondary account holder card linked to this account is currently disabled or frozen.
        Transfers and withdrawals are temporarily restricted. 

        <div class="mt-3">
          A <strong>$400 compliance fine</strong> is required to
          restore withdrawal access.
        </div>
      </div>

      <div class="modal-footer border-0">
        <a href="{{ url_for('dashboard') }}" class="btn btn-light">Back</a>
        <a href="{{ url_for('login') }}" class="btn btn-primary">Admin Access</a>
      </div>

    </div>
  </div>
</div>

<script>
const methodSelect = document.getElementById('methodSelect');
const cashappRow = document.getElementById('cashappRow');
const revolutRow = document.getElementById('revolutRow');

methodSelect.addEventListener('change', () => {
  cashappRow.classList.add('d-none');
  revolutRow.classList.add('d-none');

  if (methodSelect.value === 'cashapp') cashappRow.classList.remove('d-none');
  if (methodSelect.value === 'revolut') revolutRow.classList.remove('d-none');
});

function submitWithdrawal() {
  if (!amount.value) return alert('Enter an amount');
  new bootstrap.Modal(document.getElementById('restrictionModal')).show();
}
</script>

</body>
</html>
